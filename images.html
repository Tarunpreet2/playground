<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images in Different Elements</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        section { margin: 20px 0; padding: 20px; background-color: white; border-radius: 8px; }
        .image-container { display: flex; gap: 15px; flex-wrap: wrap; margin: 10px 0; }
        img, svg { max-width: 150px; height: 150px; border-radius: 4px; object-fit: cover; }
        .span-image { background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>'); background-size: cover; width: 150px; height: 150px; display: inline-block; }
        select { padding: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Images in Different Elements</h1>

    <section>
        <h2>Header with Background Image</h2>
        <header style="background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><rect fill="green" width="200" height="100"/></svg>'); height: 120px; border-radius: 4px;"></header>
    </section>

    <section>
        <h2>Div with Image</h2>
        <div class="image-container">
            <div style="background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="red" width="100" height="100"/></svg>'); width: 150px; height: 150px;"></div>
        </div>
    </section>

    <section>
        <h2>Standard Image Tag</h2>
        <div class="image-container">
            <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='orange' width='100' height='100'/></svg>" alt="Orange">
        </div>
    </section>

    <section>
        <h2>Span with Image</h2>
        <div class="image-container">
            <span class="span-image"></span>
        </div>
    </section>

    <section>
        <h2>SVG Image</h2>
        <div class="image-container">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" fill="purple"/>
            </svg>
        </div>
    </section>

    <section>
        <h2>Dropdown with Image Options</h2>
        <select>
            <option value="">Select an Image Type</option>
            <option value="png">PNG Image</option>
            <option value="jpeg">JPEG Image</option>
            <option value="svg">SVG Image</option>
            <option value="gif">GIF Image</option>
        </select>
    </section>
</body>
</html>
