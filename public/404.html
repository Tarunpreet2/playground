<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Remove repeated slashes and redirect only if not already at the correct path
      var pathname = window.location.pathname.replace(/^\/playground/, "");
      var cleanPath = pathname.replace(/\/+$/, ""); // Remove trailing slashes
      var newUrl = "/playground" + cleanPath + window.location.search + window.location.hash;
      if (window.location.pathname !== newUrl) {
        window.location.replace(newUrl);
      }
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
  </body>
</html>
